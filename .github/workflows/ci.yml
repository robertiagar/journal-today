name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Renderer and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test --workers=2
      - run: pnpm build
      - name: Upload renderer diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: renderer-diagnostics
          path: |
            test-results/renderer/**/*.png
            test-results/renderer/**/*.zip
            test-results/renderer/**/*.md
          retention-days: 7

  desktop:
    name: Desktop checks
    uses: ./.github/workflows/desktop.yml

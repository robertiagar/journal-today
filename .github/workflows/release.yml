name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      include_arm64:
        description: Include Windows and Linux ARM64 installers
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require a tag matching package.json
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Tag must be v${version}, received ${process.env.GITHUB_REF_NAME}`);
          }
          NODE

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  installers:
    needs: checks
    uses: ./.github/workflows/desktop.yml
    secrets:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    with:
      installers: true
      include_arm64: ${{ github.event_name == 'push' || inputs.include_arm64 }}

  draft:
    name: Draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: |
          test -n "$(find . -maxdepth 1 -name 'latest*.yml' -print -quit)"
          sha256sum journal-today-* latest*.yml > SHA256SUMS.txt
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            node -e "if (!require('./release-state.json').isDraft) throw new Error('Refusing to replace assets on a published release')"
          else
            args=("$RELEASE_TAG" --verify-tag --draft --title "Journal Today $RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
